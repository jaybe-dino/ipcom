# Desktop (apps/desktop, Tauri) and mobile (apps/mobile, Expo) are intentionally
# NOT in the install graph: their native toolchains (Rust / React Native) are
# heavy and platform-specific. They consume the same workspace packages and are
# bootstrapped on demand — see each app's README.
packages:
  - "packages/*"
  - "apps/web"
  - "apps/api"
  # Browser E2E harness. No build/test/typecheck script, so `turbo build`/`test`
  # skip it; run explicitly with `pnpm --filter @remix-hub/e2e smoke`.
  - "e2e"
